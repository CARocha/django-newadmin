[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-newadmin"
dynamic = ["version"]
description = "A polished, extensible theme for Django's built-in admin."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["Django>=6.0,<6.2"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "playwright>=1.52",
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.11",
    "twine>=7,<8",
]
docs = ["Sphinx>=8.2,<10", "myst-parser>=4,<6", "furo>=2025.7.19,<2027"]

[project.urls]
Documentation = "https://github.com/CARocha/django-newadmin#readme"
Repository = "https://github.com/CARocha/django-newadmin"
Issues = "https://github.com/CARocha/django-newadmin/issues"

[tool.hatch.version]
path = "src/newadmin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/newadmin"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = ["browser: end-to-end checks in a real browser"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
