{% load i18n %}
{% with id=chart_id|default:chart.id %}
{% with config_id=id|add:"-config" title_id=id|add:"-title" %}
<figure class="adminwp-panel adminwp-chart" aria-labelledby="{{ title_id }}">
  <figcaption class="adminwp-panel__header{% if compact %} visually-hidden{% endif %}">
    <div>
      <h2 id="{{ title_id }}">{{ chart.title }}</h2>
      {% if chart.description %}<p>{{ chart.description }}</p>{% endif %}
    </div>
  </figcaption>
  {% if chart.rows %}
    <div id="{{ id }}" class="adminwp-chart__plot" data-adminwp-chart data-chart-config="{{ config_id }}"></div>
    {{ chart.option|json_script:config_id }}
    <details class="adminwp-chart__data">
      <summary>{% translate 'View chart data' %}</summary>
      <div class="adminwp-panel__scroll" tabindex="0" role="region" aria-label="{{ chart.title }}">
        <table>
          <caption class="visually-hidden">{{ chart.title }}</caption>
          <thead><tr>{% for column in chart.columns %}<th scope="col">{{ column }}</th>{% endfor %}</tr></thead>
          <tbody>{% for row in chart.rows %}<tr>{% for cell in row %}{% if forloop.first %}<th scope="row">{{ cell }}</th>{% else %}<td>{{ cell }}</td>{% endif %}{% endfor %}</tr>{% endfor %}</tbody>
        </table>
      </div>
    </details>
  {% else %}
    <p class="adminwp-panel__empty">{% translate 'No data to display yet.' %}</p>
  {% endif %}
</figure>
{% endwith %}
{% endwith %}
