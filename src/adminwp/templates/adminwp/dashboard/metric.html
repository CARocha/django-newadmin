{% load i18n %}
<article class="adminwp-metric adminwp-metric--{{ metric.tone }}">
  <h2>{{ metric.label }}</h2>
  <p class="adminwp-metric__value">{{ metric.value }}</p>
  <p class="adminwp-metric__share">{{ metric.share|floatformat:0 }}% {% translate 'of all entries' %}</p>
  {% if metric.chart %}
    {% include "adminwp/dashboard/chart.html" with chart=metric.chart compact=True %}
  {% endif %}
</article>
